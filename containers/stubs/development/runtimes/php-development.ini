[PHP]
variables_order = EGPCS
memory_limit = 4096M
max_execution_time = 90
max_input_time = 90
upload_max_filesize = 100M
post_max_size = 100M

[opcache]
opcache.enable = 0
opcache.enable_cli = 0

[xdebug]
; The runtime image has Xdebug. Turn it on with XDEBUG_MODE=debug (or
; develop, coverage, ...) in app.env when you need it.
xdebug.mode = off
