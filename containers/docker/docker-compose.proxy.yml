# Docker Compose — with Caddy reverse proxy.
# Extends the base compose file and adds a proxy network + Caddy service.
#
# Usage (merges with docker-compose.yml automatically):
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
#
# Place your Caddyfile at containers/podman/systemd/proxy/config/Caddyfile
# (reuses the same config directory as the Quadlet setup).

name: stry

services:
    # ---------------------------------------------------------------------------
    # Infrastructure — attach proxy-facing services to the proxy network
    # ---------------------------------------------------------------------------

    rustfs:
        networks:
            - stry
            - proxy

    mailpit:
        networks:
            - stry
            - proxy

    # ---------------------------------------------------------------------------
    # Application — attach proxy-facing roles to the proxy network
    # ---------------------------------------------------------------------------

    app:
        networks:
            - stry
            - proxy

    reverb:
        networks:
            - stry
            - proxy

    # ---------------------------------------------------------------------------
    # Reverse proxy
    # ---------------------------------------------------------------------------

    proxy:
        image: docker.io/library/caddy:latest
        restart: always
        cap_add:
            - NET_BIND_SERVICE
        volumes:
            - ../podman/systemd/proxy/config:/etc/caddy
            - caddy-data:/data
            - caddy-config:/config
        networks:
            - proxy
        ports:
            - '80:80'
            - '443:443'
            - '443:443/udp'

# -----------------------------------------------------------------------------
# Additional volumes for proxy
# -----------------------------------------------------------------------------

volumes:
    caddy-data:
    caddy-config:

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------

networks:
    proxy:
