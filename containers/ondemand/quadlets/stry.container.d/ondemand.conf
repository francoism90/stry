# Lets the on-demand socket start and stop the app: it no longer starts at
# boot, stops once the on-demand proxy is gone, and listens on
# 127.0.0.1:18000, where the proxy forwards to, instead of port 8000.
# The empty PublishPort= and WantedBy= clear the values of stry.container.
[Unit]
StopWhenUnneeded=yes

[Container]
PublishPort=
PublishPort=127.0.0.1:18000:8000

[Install]
WantedBy=
