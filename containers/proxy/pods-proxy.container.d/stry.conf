# Lets the Pods proxy reach stry's containers, and gives it stry's
# hostnames. Copy it to ~/.config/containers/systemd/pods-proxy.container.d/
# and change the hostnames to yours. The STRY_VITE_HOST, STRY_MAIL_HOST and
# STRY_S3_CONSOLE_HOST lines are only used by stry-development.Caddyfile.
[Container]
Network=stry.network
Environment=STRY_HOST=stry.example.com
Environment=STRY_WS_HOST=ws.stry.example.com
Environment=STRY_S3_HOST=s3.stry.example.com
Environment=STRY_VITE_HOST=vite.stry.example.com
Environment=STRY_MAIL_HOST=mail.stry.example.com
Environment=STRY_S3_CONSOLE_HOST=console.s3.stry.example.com
# Behind another proxy that handles HTTPS, such as on a host shared with
# other users:
# Environment=PROXY_SCHEME=http
