# How Pods (https://github.com/foxws/pods) offers and installs stry. Pods
# reads it when you add stry from Git; it never changes the Quadlet files.
version: 1
name: stry
description: Self-hosted video library and streaming

sources:
  production:
    path: containers/quadlets/production
    description: The published image from ghcr.io/francoism90/stry
  development:
    path: containers/quadlets/development
    description: Builds and runs a checkout in ~/projects/stry on the host

secrets:
  stry-env:
    description: Your .env file. The other secrets are filled in from it.
    format: dotenv
  stry-pgsql-db:
    description: Name of the database
    from: stry-env
    key: DB_DATABASE
  stry-pgsql-user:
    description: Database user
    from: stry-env
    key: DB_USERNAME
  stry-pgsql-password:
    description: Password of the database user
    from: stry-env
    key: DB_PASSWORD
  stry-typesense-api-key:
    description: Typesense API key
    from: stry-env
    key: TYPESENSE_API_KEY
  stry-rustfs-access-key:
    description: RustFS access key
    from: stry-env
    key: AWS_ACCESS_KEY_ID
  stry-rustfs-secret-key:
    description: RustFS secret key
    from: stry-env
    key: AWS_SECRET_ACCESS_KEY

# Steps the application page in Pods offers once the units are up. Each one
# runs in the container of a Quadlet, and is safe to run again.
after_install:
  install:
    label: Install stry
    description: Migrates the database, seeds the roles and sets up the search indexes.
    container: stry
    user: docker
    command: php artisan app:install --no-interaction
  s3:
    label: Create the S3 buckets
    description: Creates the buckets and their CORS policy in RustFS.
    container: stry
    user: docker
    command: php artisan app:s3-setup --no-interaction
  admin:
    label: Create a super-admin
    container: stry
    user: docker
    command: php artisan users:create --super-admin --password-stdin --no-interaction
    inputs:
      name:
        label: Name
        option: --name
      email:
        label: Email
        type: email
        option: --email
      password:
        label: Password
        type: password

# Steps the application page offers after Pods updates stry to a new release.
after_update:
  update:
    label: Update stry
    description: Runs the migrations, clears the settings cache and restarts the workers.
    container: stry
    user: docker
    command: php artisan app:update --no-interaction

# The containers the Pods proxy can give a hostname. Pods asks for the
# hostnames when installing; they must match APP_URL, VITE_REVERB_HOST and
# AWS_URL in your .env (and in development VITE_HMR_HOST, MAILPIT_UI_HOST and
# RUSTFS_CONSOLE_HOST). Leave one empty for no route. The first is the main
# one: while stry is on demand, lpod sends it to the socket, so a request
# wakes the app. "via: main" routes go there too, and stry's own Caddy
# (Support\Octane\CaddySites) forwards them, so they wake the app as well.
routes:
  app:
    upstream: systemd-stry:8000
    description: The web app (the host in APP_URL)
  ws:
    upstream: systemd-stry-reverb:6001
    via: main
    description: Laravel Reverb (VITE_REVERB_HOST)
  s3:
    upstream: systemd-stry-rustfs:9000
    via: main
    description: RustFS's S3 API (the host in AWS_URL)
  vite:
    upstream: systemd-stry-vite:5173
    description: Development only, the Vite dev server (VITE_HMR_HOST)
  mail:
    upstream: systemd-stry-mailpit:8025
    description: Development only, Mailpit's web UI (MAILPIT_UI_HOST)
  s3-console:
    upstream: systemd-stry-rustfs:9001
    description: Development only, the RustFS console (RUSTFS_CONSOLE_HOST)

# Optional: start the app on its first request, and let it and its services
# sleep when idle. lpod writes the units (`lpod stry ondemand enable`, see
# docs/podman.md); the keys match its flags.
ondemand:
  # The socket listens here, and a proxy sends stry's hostname to it.
  port: 8000
  # Where Octane listens inside the app container.
  app_port: 8000
  idle_timeout: 10min
  # Keeps running after the app stops, until the idle check stops it.
  workers:
    - stry-horizon
  # Succeeds when no jobs or queries are in progress.
  idle_check:
    container: stry-horizon
    user: docker
    command: php -d variables_order=EGPCS /app/artisan app:idle
  # Runs "schedule:run" only in the minutes a task is due, so the database
  # and cache can sleep in between. "at" is in UTC. Keep it in sync with the
  # schedule (routes/console.php and the packages' scheduled tasks).
  schedule:
    container: stry-schedule
    at: ['*:00', '01:00', '02:00']
    environment:
      APP_COMMAND: php -d variables_order=EGPCS /app/artisan schedule:run
      APP_OPTIMIZE: 'false'
