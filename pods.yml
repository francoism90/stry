# How Pods (https://github.com/foxws/pods) offers and installs stry. Pods
# reads it when you add stry from Git; it never changes the Quadlet files.
version: 1
name: stry
description: Self-hosted video library and streaming

sources:
  production:
    path: containers/quadlets/production
    description: The published image from ghcr.io/francoism90/stry
  development:
    path: containers/quadlets/development
    description: Builds and runs a checkout in ~/projects/stry on the host

secrets:
  stry-env:
    description: Your .env file. The other secrets are filled in from it.
    format: dotenv
  stry-pgsql-db:
    description: Name of the database
    from: stry-env
    key: DB_DATABASE
  stry-pgsql-user:
    description: Database user
    from: stry-env
    key: DB_USERNAME
  stry-pgsql-password:
    description: Password of the database user
    from: stry-env
    key: DB_PASSWORD
  stry-typesense-api-key:
    description: Typesense API key
    from: stry-env
    key: TYPESENSE_API_KEY
  stry-rustfs-access-key:
    description: RustFS access key
    from: stry-env
    key: AWS_ACCESS_KEY_ID
  stry-rustfs-secret-key:
    description: RustFS secret key
    from: stry-env
    key: AWS_SECRET_ACCESS_KEY

# Optional: start the app on its first request, and let it and its services
# sleep when idle. lpod writes the units (`lpod stry ondemand enable`, see
# docs/podman.md); the keys match its flags.
ondemand:
  # The socket listens here, and a proxy sends stry's hostname to it.
  port: 8000
  # Where Octane listens inside the app container.
  app_port: 8000
  idle_timeout: 10min
  # Keeps running after the app stops, until the idle check stops it.
  workers:
    - stry-horizon
  # Succeeds when no jobs or queries are in progress.
  idle_check:
    container: stry-horizon
    user: docker
    command: php -d variables_order=EGPCS /app/artisan app:idle
  # Runs "schedule:run" only in the minutes a task is due, so the database
  # and cache can sleep in between. Keep "at" in sync with the schedule
  # (routes/console.php and the packages' scheduled tasks).
  schedule:
    container: stry-schedule
    at: ["*:00", "01:00", "02:00"]
    timezone: UTC
    environment:
      APP_COMMAND: php -d variables_order=EGPCS /app/artisan schedule:run
      APP_OPTIMIZE: "false"
