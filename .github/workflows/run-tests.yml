name: Tests

on:
    push:
    pull_request:

jobs:
    tests:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-latest]
                php: [8.3, 8.4]

        name: P${{ matrix.php }} - ${{ matrix.os }}

        services:
            postgres:
                image: postgres:latest
                env:
                    POSTGRES_DB: testing
                    POSTGRES_USER: laravel
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
            redis:
                image: redis:latest
                ports:
                    - 6379:6379
                options: --entrypoint redis-server

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv, imagick, fileinfo, pcov, redis
                  coverage: none

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Build application
              run: |
                  cp .env.example .env
                  php artisan key:generate
                  php artisan storage:link
                  php artisan wayfinder:generate
                  pnpm install
                  pnpm build

            - name: Execute tests
              run: |
                  pnpm test
                  php artisan test
