name: Build

on:
    push:
        branches:
            - main
    release:
        types: [published]
    # Weekly, the latest stable release (or the newest pre-release while
    # there's none) is built again under the same tags, for Debian and PHP
    # security updates. The units set AutoUpdate=registry, so
    # "podman auto-update" picks it up without a new release.
    schedule:
        - cron: '0 4 * * 1'
    workflow_dispatch:
        inputs:
            rebuild-release:
                description: Rebuild the latest stable release under its own tags, as the weekly run does
                type: boolean
                default: false

concurrency:
    group: docker-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.event.repository.name }}
    IMAGE: ghcr.io/${{ github.repository }}
    CACHE_IMAGE: ghcr.io/${{ github.repository }}-cache

permissions:
    contents: read

jobs:
    release:
        name: Pick the source
        runs-on: ubuntu-latest
        outputs:
            ref: ${{ steps.pick.outputs.ref }}
            rebuild: ${{ steps.pick.outputs.rebuild }}
            version: ${{ steps.pick.outputs.version }}
            prerelease: ${{ steps.pick.outputs.prerelease }}

        steps:
            - name: Pick the release to rebuild, or the event's ref
              id: pick
              env:
                  GH_TOKEN: ${{ github.token }}
                  REBUILD: ${{ github.event_name == 'schedule' || inputs.rebuild-release == true }}
              run: |
                  echo "rebuild=${REBUILD}" >> "$GITHUB_OUTPUT"

                  if [ "${REBUILD}" != "true" ]; then
                    echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  # The latest stable release, which the major and "latest"
                  # tags point at, or the newest pre-release while there's none.
                  prerelease=false
                  tag="$(gh release view --repo "${{ github.repository }}" --json tagName --jq '.tagName' 2>/dev/null || true)"

                  if [ -z "${tag}" ]; then
                    prerelease=true
                    tag="$(gh release list --repo "${{ github.repository }}" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')"
                  fi

                  if [ -z "${tag}" ]; then
                    echo "::error::There's no release to rebuild."
                    exit 1
                  fi

                  echo "ref=refs/tags/${tag}" >> "$GITHUB_OUTPUT"
                  echo "version=${tag}" >> "$GITHUB_OUTPUT"
                  echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

    build:
        name: Build (${{ matrix.platform }})
        needs: release
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release.outputs.ref }}

            - name: Install dockerignore
              run: cp containers/runtimes/production/dockerignore .dockerignore

            - name: Set platform pair
              id: platform
              env:
                  PLATFORM: ${{ matrix.platform }}
              run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

            - name: Login to GitHub Container Registry
              run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

            - name: Determine build args
              id: buildargs
              run: |
                  {
                    echo "args<<EOF"
                    echo "--target=production"
                    # A rebuild of a release skips the layer cache, so apt and
                    # the PHP extensions install their newest versions.
                    if [ "${{ needs.release.outputs.rebuild }}" = "true" ]; then
                      echo "--pull=always"
                    else
                      echo "--cache-from=${CACHE_IMAGE}"
                    fi
                    echo "--cache-to=${CACHE_IMAGE}"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Build image
              id: build
              uses: redhat-actions/buildah-build@v3
              with:
                  image: ${{ env.IMAGE_NAME }}
                  tags: ci-${{ steps.platform.outputs.pair }}-${{ github.sha }}
                  containerfiles: containers/runtimes/production/Containerfile
                  context: .
                  platform: ${{ matrix.platform }}
                  layers: true
                  squash: false
                  extra-args: ${{ steps.buildargs.outputs.args }}

            - name: Push image by tag
              id: push
              uses: redhat-actions/push-to-registry@v3
              with:
                  image: ${{ steps.build.outputs.image }}
                  tags: ${{ steps.build.outputs.tags }}
                  registry: ${{ env.REGISTRY }}/${{ github.repository_owner }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
                  digestfile: /tmp/digest.txt

            - name: Upload digest
              uses: actions/upload-artifact@v7
              with:
                  name: digests-${{ steps.platform.outputs.pair }}
                  path: /tmp/digest.txt
                  if-no-files-found: error
                  retention-days: 1

    merge:
        name: Merge & push manifest
        needs: [release, build]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Download digests
              uses: actions/download-artifact@v8
              with:
                  path: /tmp/digests
                  pattern: digests-*

            - name: Login to GitHub Container Registry
              run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

            - name: Generate image tags
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.IMAGE }}
                  flavor: |
                      latest=false
                  tags: |
                      type=ref,event=branch,enable=${{ needs.release.outputs.rebuild != 'true' }}
                      type=sha,format=long,prefix=commit-,enable=${{ needs.release.outputs.rebuild != 'true' }}
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=semver,pattern={{version}},value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.rebuild == 'true' }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.rebuild == 'true' && needs.release.outputs.prerelease != 'true' }}
                      type=semver,pattern={{major}},value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.rebuild == 'true' && needs.release.outputs.prerelease != 'true' }}
                      type=raw,value=latest,enable=${{ (github.event_name == 'release' && !github.event.release.prerelease) || (needs.release.outputs.rebuild == 'true' && needs.release.outputs.prerelease != 'true') }}

            - name: Create and push manifest list
              run: |
                  podman manifest create manifest-list

                  for digest_file in /tmp/digests/*/digest.txt; do
                    digest=$(tr -d '[:space:]' < "$digest_file")
                    podman manifest add manifest-list "docker://${IMAGE}@${digest}"
                  done

                  while IFS= read -r tag; do
                    [ -z "$tag" ] && continue
                    podman manifest push --all manifest-list "docker://${tag}"
                  done <<< "${{ steps.meta.outputs.tags }}"
