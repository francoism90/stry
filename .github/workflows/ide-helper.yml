name: IDE Helper

on:
    push:
        branches:
            - main

permissions:
    contents: write

concurrency:
    group: ide-helper-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ide-helper:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        name: Update IDE Helper Files

        services:
            postgres:
                image: postgres:latest
                env:
                    POSTGRES_DB: testing
                    POSTGRES_USER: user
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U user -d testing"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:latest
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: ${{ github.ref }}

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.5
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, intl, gd, exif, iconv, imagick, fileinfo, redis
                  coverage: none

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Prepare application
              run: |
                  cp .env.example .env
                  php artisan key:generate
                  php artisan migrate --force

            - name: Regenerate IDE helper files
              run: |
                  php artisan ide-helper:generate
                  php artisan ide-helper:meta
                  php artisan ide-helper:models --nowrite

            - name: Commit and push changes
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  commit_message: 'chore: update IDE helper files [skip ci]'
                  commit_user_name: 'github-actions[bot]'
                  commit_user_email: '41898282+github-actions[bot]@users.noreply.github.com'
                  file_pattern: '_ide_helper*.php .phpstorm.meta.php'
                  add_options: '-f'
