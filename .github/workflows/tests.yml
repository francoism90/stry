name: Tests

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-latest]
                php: [8.3, 8.4]

        name: PHP ${{ matrix.php }}

        services:
            postgres:
                image: postgres:latest
                env:
                    POSTGRES_DB: testing
                    POSTGRES_USER: user
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv, imagick, fileinfo, pcov
                  coverage: none

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Install Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 20

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Build application
              run: |
                  cp .env.ci .env
                  php artisan key:generate
                  php artisan wayfinder:generate
                  pnpm install
                  pnpm build

            - name: Execute tests
              run: |
                  php artisan test
